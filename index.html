<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dee 3D Field</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}#info{position:absolute;top:15px;left:15px;background:#0009;padding:12px;border-radius:10px}#cross{position:absolute;left:50%;top:50%;font-size:24px}#msg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#0009;padding:10px;border-radius:10px}#start{position:fixed;inset:0;display:grid;place-items:center;background:#000d;color:white;z-index:5;text-align:center}button{font-size:18px;padding:12px 20px;border:0;border-radius:10px}</style></head><body><div id="start"><div><h1>DEE 3D FIELD</h1><p>Explore, drive vehicles, and capture A / B / C zones.</p><button id="play">PLAY</button></div></div><div id="hud"><div id="info">WASD move · Shift sprint · Ctrl crouch · Space jump<br>Drive near a vehicle + E · Capture zones<br><span id="status">Zone: —</span></div><div id="cross">+</div><div id="msg">Find a capture zone</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
const s=new THREE.Scene();s.background=new THREE.Color(0x87b9d9);s.fog=new THREE.Fog(0x87b9d9,90,300);const c=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500),r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);s.add(new THREE.HemisphereLight(0xffffff,0x667788,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(80,140,40);s.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x9a9a78}));ground.rotation.x=-Math.PI/2;s.add(ground);const M=x=>new THREE.MeshStandardMaterial({color:x});function box(x,y,z,w,h,d,col){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(col));m.position.set(x,y+h/2,z);s.add(m);return m}for(let i=0;i<80;i++){let x=(Math.random()-.5)*300,z=(Math.random()-.5)*300;if(Math.hypot(x,z)<35)continue;box(x,0,z,8+Math.random()*12,8+Math.random()*35,8+Math.random()*12,0x777b80)}
const p={pos:new THREE.Vector3(0,2,20),vel:new THREE.Vector3(),yaw:0,pitch:0,crouch:false,vehicle:null},k={};addEventListener('keydown',e=>{k[e.code]=true;if(e.code.startsWith('Control'))p.crouch=true;if(e.code==='KeyE')toggle()});addEventListener('keyup',e=>{k[e.code]=false;if(e.code.startsWith('Control'))p.crouch=false});document.body.onmousemove=e=>{if(document.pointerLockElement===document.body){p.yaw-=e.movementX*.002;p.pitch=Math.max(-1.4,Math.min(1.4,p.pitch-e.movementY*.002))}};document.getElementById('play').onclick=()=>document.body.requestPointerLock();
const vs=[];for(let i=0;i<5;i++)vs.push(box(-35+i*18,.2,-5,7,1.6,11,0x24506a));function toggle(){if(p.vehicle){p.vehicle=null;return}let b=null,d=6;for(const v of vs){let q=v.position.distanceTo(p.pos);if(q<d){b=v;d=q}}if(b)p.vehicle=b}
const zs=[['A',-55,-55,0x2e8b57],['B',55,-35,0xc48a22],['C',20,65,0x6b4ca8)].map(([n,x,z,col])=>{let q=new THREE.Mesh(new THREE.CylinderGeometry(7,7,.15,40),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55}));q.position.set(x,.12,z);q.userData={n,pr:0};s.add(q);return q});
let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.04,(t-last)/1000);last=t;let sp=k.ShiftLeft?13:7;if(p.crouch)sp=4;let f=new THREE.Vector3(Math.sin(p.yaw),0,Math.cos(p.yaw)),q=new THREE.Vector3(Math.cos(p.yaw),0,-Math.sin(p.yaw)),d=new THREE.Vector3();if(k.KeyW)d.add(f);if(k.KeyS)d.sub(f);if(k.KeyD)d.add(q);if(k.KeyA)d.sub(q);if(d.lengthSq())d.normalize();if(p.vehicle){p.vehicle.position.addScaledVector(d,sp*dt*1.8);p.pos.copy(p.vehicle.position);p.pos.y=2.2}else{p.vel.y-=22*dt;if(p.pos.y<=2&&k.Space)p.vel.y=8;p.pos.addScaledVector(d,sp*dt);p.pos.y+=p.vel.y*dt;if(p.pos.y<2){p.pos.y=2;p.vel.y=0}}c.position.copy(p.pos);c.position.y=p.crouch&&!p.vehicle?1.25:p.vehicle?3.1:2;c.rotation.order='YXZ';c.rotation.y=p.yaw;c.rotation.x=p.pitch;let active='—';for(const z of zs){let dist=Math.hypot(z.position.x-p.pos.x,z.position.z-p.pos.z);if(dist<8){z.userData.pr=Math.min(100,z.userData.pr+dt*18);active=z.userData.n}else z.userData.pr=Math.max(0,z.userData.pr-dt*3)}document.getElementById('status').textContent='Zone: '+active+' · '+zs.map(z=>z.userData.n+':'+Math.round(z.userData.pr)+'%').join('  ');document.getElementById('msg').textContent=p.vehicle?'Driving · E to exit':active==='—'?'Find a capture zone':'Capturing '+active;r.render(s,c)}loop(last);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
